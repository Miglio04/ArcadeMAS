   Project supermarket

   Gradle build file for JaCaMo Applications
   agosto 19, 2024 - 08:32:01
*/

defaultTasks 'run'

apply plugin: 'java'
apply plugin: 'maven-publish'
// apply from: '.jcm-deps.gradle' // this file contains dependencies declared in the .jcm files

version '1.0'
group   'org.jacamo'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    maven { url "https://raw.githubusercontent.com/jacamo-lang/mvn-repo/master" }
    maven { url "https://repo.gradle.org/gradle/libs-releases" }
    flatDir { dirs 'lib' }
    mavenCentral()
    maven { url "https://jitpack.io" }
}

dependencies {
    // Jacamo dependency
    implementation('org.jacamo:jacamo:1.2')

    implementation('org.java-websocket:Java-WebSocket:1.5.2')
    implementation('org.apache.logging.log4j:log4j-api:2.20.0')
    implementation('org.apache.logging.log4j:log4j-core:2.20.0')

    // Lombok dependencies
    compileOnly('org.projectlombok:lombok:1.18.34')
    annotationProcessor('org.projectlombok:lombok:1.18.34')
    testCompileOnly('org.projectlombok:lombok:1.18.34')
    testAnnotationProcessor('org.projectlombok:lombok:1.18.34')

    // Json - Versione sicura aggiornata
    implementation("org.json:json:20231013") 

    // Apache Commons
    implementation('org.apache.commons:commons-lang3:3.18.0') 
    implementation('org.apache.commons:commons-text:1.11.0') 

    implementation ('com.fasterxml.jackson.core:jackson-core:2.15.2')
    implementation ('com.fasterxml.jackson.core:jackson-databind:2.15.2')

    // --- DIPENDENZE PER CHATBDI ---
    // FlatLaf: Look and Feel moderno per la GUI (risolve bug grafici)
    implementation('com.formdev:flatlaf:3.4.1')
    // txtmark: Processore Markdown per la formattazione dei messaggi chat
    implementation('com.github.rjeschke:txtmark:0.13')
}

sourceSets {
    main {
        java {
            srcDir 'src/env'
            srcDir 'src/agt'
            srcDir 'src/org'
            srcDir 'src/int'
            srcDir 'src/java'
        }
        resources {
            srcDir 'src/resources'
        }
    }
}

task run (type: JavaExec, dependsOn: 'classes') {
    group       ' JaCaMo'
    description 'runs the JaCaMo application'
    doFirst {
        mkdir 'log'
    }
    
    mainClass = 'jacamo.infra.JaCaMoLauncher'
    args 'arcade.jcm'
    
    // FIX BUG GRAFICO MAC: Forza l'uso del tema Metal per evitare i NullPointerException
    jvmArgs '-Dswing.defaultlaf=javax.swing.plaf.metal.MetalLookAndFeel'
    
    classpath sourceSets.main.runtimeClasspath
}

task buildJCMDeps (type: JavaExec, dependsOn: 'classes') {
    mainClass = 'jacamo.infra.RunJaCaMoProject'
    args = ['arcade.jcm', '--deps']
    classpath sourceSets.main.runtimeClasspath
}

jar {
    duplicatesStrategy 'exclude'
    archiveBaseName = project.name
    from (project.projectDir.absolutePath + '/src') {
        include '**/*.asl'
        include '**/*.xml'
        include '**/*.sai'
        include '**/*.ptl'
        include '**/*.jcm'
        exclude 'test'
    }
    from (project.buildDir.absolutePath + '/classes') {
        include '**/*'
    }
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
        }
    }
}

task uberJar(type: Jar, dependsOn: 'classes') {
    group      ' JaCaMo'
    description 'creates a single runnable jar file with all dependencies'
    duplicatesStrategy 'exclude'

    manifest {
        attributes 'Main-Class': 'jacamo.infra.JaCaMoLauncher'
    }
    archiveBaseName = 'jacamo-supermarket' 
    from { configurations.runtimeClasspath.findAll { it.name.endsWith('jar') }.collect { zipTree(it) } }

    from (project.projectDir.absolutePath) {
        include '**/*.asl'
        include '**/*.xml'
        include '**/*.sai'
        include '**/*.ptl'
        include '**/*.jcm'
        include '*.properties'
    }
    from (project.buildDir.absolutePath + '/jcm') {
        include '**/*'
    }
    with jar

    doFirst {
        copy {
            from 'arcade.jcm'
            rename 'arcade.jcm','default.jcm'
            into project.buildDir.absolutePath + '/jcm'
        }
    }
}

clean {
    delete 'bin'
    delete 'build'
    delete 'log'
}